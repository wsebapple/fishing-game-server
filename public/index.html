<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>게임 놀이터</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="친구·가족과 함께 하는 브라우저 게임 모음">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#8fdcff;
    --sky-bottom:#e8f8ff;
    --ink:#123a57;
    --ink-soft:#4a6a82;
    --card:#ffffff;
    --card-edge:#d7eef9;
    --accent:#ff6b6b;
    --accent-dark:#d94f4f;
    --sun:#ffc93c;
    --live:#22b573;
    --shadow:0 10px 24px rgba(8,60,95,0.16);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; }
  body{
    font-family:'Jua', system-ui, sans-serif;
    color:var(--ink);
    /* 아이폰은 background-attachment:fixed를 무시해서, 페이지 전체 높이에 걸쳐 그라데이션을 깔아요 */
    min-height:100vh;
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 420px, #d5f1ff 100%);
    -webkit-text-size-adjust:100%;
  }
  main{ max-width:960px; margin:0 auto; padding:40px 20px 56px; }

  header{ text-align:center; margin-bottom:32px; }
  header .logo{ font-size:56px; line-height:1; }
  h1{ font-size:40px; margin:12px 0 6px; letter-spacing:1px; }
  header p{ margin:0; font-size:18px; color:var(--ink-soft); }

  .games{
    display:grid; gap:20px;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    list-style:none; margin:0; padding:0;
  }
  .card{
    position:relative; display:flex; flex-direction:column;
    background:var(--card); border:3px solid var(--card-edge); border-radius:24px;
    box-shadow:var(--shadow); overflow:hidden;
    color:inherit; text-decoration:none;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  a.card:hover, a.card:focus-visible{ transform:translateY(-4px); box-shadow:0 16px 30px rgba(8,60,95,0.22); outline:none; }
  a.card:focus-visible{ border-color:var(--accent); }
  .card .art{
    height:140px; display:flex; align-items:center; justify-content:center;
    font-size:64px; letter-spacing:6px;
  }
  .card .body{ padding:16px 18px 18px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .card h2{ margin:0; font-size:24px; }
  .card .desc{ margin:0; font-size:16px; color:var(--ink-soft); line-height:1.45; }
  .tags{ display:flex; flex-wrap:wrap; gap:6px; margin-top:2px; }
  .tag{ font-size:13px; padding:3px 10px; border-radius:999px; background:#eef8fd; color:var(--ink-soft); }
  .card .foot{ margin-top:auto; padding-top:8px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .play{
    font-size:18px; color:#fff; background:var(--accent); border-radius:999px;
    padding:8px 18px; box-shadow:0 4px 0 var(--accent-dark);
    white-space:nowrap; flex-shrink:0;
  }
  .live{ font-size:14px; color:var(--live); min-height:1em; }
  .live::before{ content:""; display:inline-block; width:8px; height:8px; margin-right:6px; border-radius:50%; background:var(--live); vertical-align:middle; }
  .live:empty::before{ display:none; }

  /* 아직 준비 중인 게임 자리 */
  .card.soon{ opacity:0.72; border-style:dashed; box-shadow:none; }
  .card.soon .art{ filter:grayscale(0.6); }
  .soonBadge{ font-size:15px; color:var(--ink-soft); background:#eef3f6; border-radius:999px; padding:6px 14px; }

  footer{ margin-top:36px; text-align:center; font-size:14px; color:var(--ink-soft); }

  .tabBar{ display:flex; justify-content:center; gap:10px; margin:0 0 24px; }
  .tabBtn{
    font:inherit; font-size:16px; color:var(--ink-soft); background:var(--card);
    border:2px solid var(--card-edge); border-radius:999px; padding:8px 20px; cursor:pointer;
  }
  .tabBtn.active{ color:#fff; background:var(--accent); border-color:var(--accent-dark); }

  .pointsBar{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin:0 0 20px; font-size:16px; color:var(--ink-soft);
  }
  .pointsBar .amount{ font-size:18px; color:var(--ink); font-weight:bold; }
  .pointsBar button, .pointsBar a{
    font:inherit; font-size:13px; color:var(--ink-soft); background:none;
    border:1px solid var(--card-edge); border-radius:999px; padding:4px 12px; cursor:pointer;
    text-decoration:none;
  }

  .modalOverlay{
    position:fixed; inset:0; background:rgba(8,60,95,0.35);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:10;
  }
  .modalOverlay[hidden]{ display:none; }
  .modalCard{
    background:var(--card); border-radius:20px; box-shadow:var(--shadow);
    padding:24px 22px; width:100%; max-width:320px; text-align:center;
  }
  .modalCard h2{ margin:0 0 6px; font-size:22px; }
  .modalCard p{ margin:0 0 16px; font-size:15px; color:var(--ink-soft); }
  .modalCard input{
    width:100%; font:inherit; font-size:18px; padding:10px 14px; margin-bottom:10px;
    border:2px solid var(--card-edge); border-radius:12px; box-sizing:border-box; text-align:center;
  }
  .modalCard .error{ min-height:1.4em; font-size:14px; color:var(--accent-dark); margin-bottom:6px; }
  .modalCard button[type=submit]{
    width:100%; font:inherit; font-size:18px; color:#fff; background:var(--accent);
    border:none; border-radius:999px; padding:10px 18px; box-shadow:0 4px 0 var(--accent-dark); cursor:pointer;
  }

  @media (max-width: 480px){
    main{ padding:28px 16px 40px; }
    header .logo{ font-size:44px; }
    h1{ font-size:30px; }
    header p{ font-size:16px; }
    .card .art{ height:110px; font-size:52px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="logo" aria-hidden="true">🎮</div>
    <h1>게임 놀이터</h1>
    <p>하고 싶은 게임을 골라요!</p>
  </header>

  <div class="pointsBar" id="pointsBar" hidden>
    <span><span id="pointsName"></span>님, 포인트 <span class="amount" id="pointsAmount"></span>점</span>
    <a href="/admin/" id="adminLinkBtn" hidden>관리자 페이지</a>
    <button type="button" id="switchNameBtn">다른 이름으로</button>
  </div>

  <div class="tabBar" id="tabBar">
    <button type="button" class="tabBtn" data-tab="fun">즐거운 게임</button>
    <button type="button" class="tabBtn" data-tab="learning">포인트 쌓기</button>
  </div>

  <ul class="games" id="gameList"></ul>

  <footer>친구 순위와 온라인 방은 게임마다 따로 있어요.</footer>
</main>

<div class="modalOverlay" id="loginOverlay">
  <div class="modalCard">
    <h2>이름과 PIN을 입력해요</h2>
    <p>처음이면 새로 만들어지고, 다음에 올 때도 같은 이름+PIN으로 내 포인트를 이어서 써요.</p>
    <form id="loginForm">
      <input type="text" id="loginName" placeholder="이름" maxlength="12" autocomplete="off" required>
      <input type="text" id="loginPin" placeholder="PIN 4자리" inputmode="numeric" pattern="\d{4}" maxlength="4" autocomplete="off" required>
      <div class="error" id="loginError"></div>
      <button type="submit">시작하기</button>
    </form>
  </div>
</div>

<script>
// 게임 목록: 새 게임을 만들면 public/<폴더>/ 에 넣고 여기에 한 줄 추가하면 메인 화면에 나타나요.
// href가 없으면 "곧 나와요" 카드로 보여요. liveApi가 있으면 지금 온라인에서 몇 명이 하고 있는지 보여줘요.
// category: 'fun'인 게임은 카드를 누르면 입장료(포인트)를 먼저 확인/차감해요. 'learning'은 아직 없어요(항상 무료 입장).
const GAMES = [
  {
    id: 'fishing',
    category: 'fun',
    title: '바다 낚시',
    art: '🎣🐟🦈',
    artBg: 'linear-gradient(180deg, #bdeeff 0%, #1fb4d9 55%, #0b72b9 100%)',
    desc: '낚싯바늘을 움직여 물고기를 잡아요. 보스와 날씨, 보물통까지! 온라인에서 친구와 점수 경쟁도 할 수 있어요.',
    tags: ['혼자하기', '온라인 같이하기', '폰·PC'],
    href: '/fishing/',
    liveApi: '/rooms',
  },
  {
    id: 'sea-picnic',
    category: 'fun',
    title: '바다 소풍',
    art: '🧺✨🧚',
    artBg: 'linear-gradient(135deg, #bdeeff 0%, #ffd3ec 55%, #d8c4ff 100%)',
    desc: '테마를 골라 물고기 친구를 만나요! 바다아이·아기 상어·오로라 요정 중 하나를 고르고, 난이도(상·중·하)도 정할 수 있어요.',
    tags: ['혼자하기', '테마 3종', '난이도 조절', '폰·PC'],
    href: '/sea-picnic/',
  },
  {
    id: 'nemo-adventure',
    category: 'fun',
    title: '호야의 네모 모험',
    art: '🟨🎵✈️',
    artBg: 'linear-gradient(180deg, #3a1c71 0%, #b1418f 60%, #ff9f6b 100%)',
    desc: '음악에 맞춰 네모가 톡톡 점프해요! 트램폴린, 분홍 동그라미, 상어 웅덩이를 지나고 비행기로 변신해서 깃발까지 가요.',
    tags: ['혼자하기', '리듬 점프', '구간 연습', '폰·PC'],
    href: '/nemo-adventure/',
  },
  {
    id: 'spaceship',
    category: 'fun',
    title: '우주선 뿅뿅대작전',
    art: '🚀👾✨',
    artBg: 'linear-gradient(180deg, #05030f 0%, #1d1340 55%, #4a1e79 100%)',
    desc: '우주선을 움직여 외계 함대를 무찔러요! 레이저는 자동으로 뿅뿅뿅, 파워업도 챙기고 5웨이브마다 나오는 보스도 물리쳐봐요.',
    tags: ['혼자하기', '슈팅 액션', '보스전', '폰·PC'],
    href: '/spaceship/',
  },
  {
    id: 'fruit-game',
    category: 'fun',
    title: '과일 합체 게임',
    art: '🍒🍊🍉',
    artBg: 'linear-gradient(180deg, #fff3df 0%, #ffd79b 100%)',
    desc: '같은 과일 두 개를 합치면 다음 과일이 돼요! 빨간 줄 위로 넘치지 않게 두리안까지 만들어봐요.',
    tags: ['혼자하기', '두뇌 게임', '폰·PC'],
    href: '/fruit-game/',
  },
  {
    id: 'gunner',
    category: 'fun',
    title: '총잡이 대작전',
    art: '🔫👹💥',
    artBg: 'linear-gradient(180deg, #14100a 0%, #3a2c14 55%, #6b4e1c 100%)',
    desc: '사방에서 몰려오는 몬스터를 향해 총알이 자동으로 슝슝! 아이템을 챙기고 5웨이브마다 나오는 보스도 물리쳐봐요.',
    tags: ['혼자하기', '슈팅 액션', '보스전', '폰·PC'],
    href: '/gunner/',
  },
  {
    id: 'land-grab',
    category: 'fun',
    title: '탐사로봇 땅따먹기',
    art: '🤖🪨✂️',
    artBg: 'linear-gradient(180deg, #142042 0%, #070a16 100%)',
    desc: '옛날 오락실 볼피드처럼! 탐사로봇으로 우주 바위를 잘라내 내 땅으로 만들어요. 바위 괴물을 피해 정해진 비율만큼 땅을 차지해봐요.',
    tags: ['혼자하기', '스테이지 클리어', '폰·PC'],
    href: '/land-grab/',
  },
  {
    id: 'hanja-game',
    category: 'learning',
    title: '한자 맞추기',
    art: '🀄📜✨',
    artBg: 'linear-gradient(180deg, #fdf6e3 0%, #f0dfb3 60%, #d64541 130%)',
    desc: '한자를 보고 알맞은 훈음을 골라요! 시간 제한 안에 콤보를 쌓으면 점수 배율과 보너스 시간이 쑥쑥 늘어나요.',
    tags: ['혼자하기', '학습', '타이머·콤보', '폰·PC'],
    href: '/hanja-game/',
  },
  {
    id: 'baseball',
    category: 'fun',
    title: '완전한 9이닝 대전 야구',
    art: '⚾🧢🏆',
    artBg: 'linear-gradient(180deg, #142042 0%, #070a16 100%)',
    desc: '친구와 방을 만들어 팀을 꾸리고 9이닝을 겨뤄요! 투수는 코스를, 타자는 노릴 곳을 몰래 골라서 눈치싸움으로 승부해요.',
    tags: ['온라인 같이하기', '2인 대전', '9이닝', '폰·PC'],
    href: '/baseball/',
    liveApi: '/baseball/rooms',
  },
  {
    category: 'fun',
    title: '다음 게임',
    art: '🎲',
    artBg: 'linear-gradient(180deg, #e3dcff 0%, #a99bff 100%)',
    desc: '새 게임을 준비하고 있어요.',
    tags: [],
  },
];

let GAME_COSTS = {};
let activeTab = 'fun';

function el(tag, className, text){
  const node = document.createElement(tag);
  if(className) node.className = className;
  if(text != null) node.textContent = text;
  return node;
}

function renderGames(){
  const list = document.getElementById('gameList');
  list.innerHTML = '';
  GAMES.filter(game => (game.category || 'fun') === activeTab).forEach(game => {
    const item = el('li');
    const card = el(game.href ? 'a' : 'div', 'card' + (game.href ? '' : ' soon'));
    if(game.href) card.href = game.href;
    else card.setAttribute('aria-disabled', 'true');

    const art = el('div', 'art', game.art);
    art.style.background = game.artBg;
    art.setAttribute('aria-hidden', 'true');
    card.appendChild(art);

    const body = el('div', 'body');
    body.appendChild(el('h2', null, game.title));
    body.appendChild(el('p', 'desc', game.desc));
    const cost = game.category === 'fun' ? GAME_COSTS[game.id] : null;
    const cardTags = cost != null ? [...game.tags, '입장료 ' + cost + '점'] : game.tags;
    if(cardTags.length){
      const tags = el('div', 'tags');
      cardTags.forEach(t => tags.appendChild(el('span', 'tag', t)));
      body.appendChild(tags);
    }
    const foot = el('div', 'foot');
    const live = el('span', 'live');
    foot.appendChild(live);
    foot.appendChild(game.href ? el('span', 'play', '하러 가기 ▶') : el('span', 'soonBadge', '곧 나와요'));
    body.appendChild(foot);
    card.appendChild(body);
    item.appendChild(card);
    list.appendChild(item);

    if(game.liveApi) showLiveCount(game.liveApi, live);
    if(game.href && game.category === 'fun') card.addEventListener('click', e => handleFunGameClick(e, game));
  });
}

// 즐거운 게임 카드를 누르면 로그인/포인트를 확인하고, 입장료만큼 차감된 뒤에만 실제 게임으로 이동해요
async function handleFunGameClick(e, game){
  e.preventDefault();
  const token = localStorage.getItem(POINTS_TOKEN_KEY);
  if(!token){
    showLoginOverlay('먼저 이름과 PIN으로 로그인해주세요.');
    return;
  }
  const cost = GAME_COSTS[game.id];
  const current = Number(document.getElementById('pointsAmount').textContent);
  if(cost != null && Number.isFinite(current) && current < cost){
    alert('포인트가 부족해요. (필요: ' + cost + '점, 내 포인트: ' + current + '점)');
    return;
  }
  try {
    const res = await fetch('/api/points/spend', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ gameId: game.id }),
    });
    const data = await res.json();
    if(!res.ok){
      if(res.status === 401) showLoginOverlay('다시 로그인해주세요.');
      else alert(data.error || '입장에 실패했어요.');
      return;
    }
    document.getElementById('pointsAmount').textContent = data.points;
    location.href = game.href;
  } catch (err) {
    alert('서버에 연결할 수 없어요. 잠시 후 다시 시도해주세요.');
  }
}

// 게임별 입장료를 미리 받아둬요(못 불러오면 카드에 입장료 표시만 생략되고, 입장은 서버가 그때 다시 확인해요)
async function loadCosts(){
  try {
    const res = await fetch('/api/points/costs', { cache: 'no-store' });
    if(res.ok) GAME_COSTS = await res.json();
  } catch (e) { /* 못 불러오면 조용히 넘어가요 */ }
}

// 지금 온라인 방에 들어와 있는 사람 수를 보여줘요 (못 불러오면 조용히 비워둬요)
async function showLiveCount(url, target){
  try {
    const res = await fetch(url, { cache: 'no-store' });
    if(!res.ok) return;
    const rooms = await res.json();
    const players = rooms.reduce((sum, r) => sum + (r.players || 0), 0);
    if(players > 0) target.textContent = '지금 ' + players + '명이 온라인에서 하는 중';
  } catch (e) { /* 서버가 잠깐 안 되면 표시만 생략해요 */ }
}

const POINTS_TOKEN_KEY = 'fishing.points.token';
// 이 이름으로 로그인하면 허브 화면에 관리자 페이지 버튼을 보여줘요. 버튼은 /admin/으로 가는 링크일 뿐이고,
// 실제 관리자 권한은 그 페이지에서 따로 관리자 코드(ADMIN_KEY)를 넣어야 생겨요 — 이 이름/PIN만으로는 아무 권한도 안 생겨요.
const ADMIN_NAME = '이수인';

function showLoginOverlay(message){
  document.getElementById('loginError').textContent = message || '';
  document.getElementById('loginOverlay').hidden = false;
}
function hideLoginOverlay(){
  document.getElementById('loginOverlay').hidden = true;
}
function showPointsBar(name, amount){
  document.getElementById('pointsName').textContent = name;
  document.getElementById('pointsAmount').textContent = amount;
  document.getElementById('adminLinkBtn').hidden = name !== ADMIN_NAME;
  document.getElementById('pointsBar').hidden = false;
}

// 저장된 토큰으로 자동 로그인을 시도하고, 없거나 더 이상 유효하지 않으면 이름/PIN 입력창을 보여줘요
async function initPoints(){
  const token = localStorage.getItem(POINTS_TOKEN_KEY);
  if(token){
    try {
      const res = await fetch('/api/points/me', { headers: { Authorization: 'Bearer ' + token } });
      if(res.ok){
        const data = await res.json();
        showPointsBar(data.name, data.points);
        hideLoginOverlay();
        return;
      }
    } catch (e) { /* 서버가 잠깐 안 되면 아래에서 로그인 화면을 보여줘요 */ }
    localStorage.removeItem(POINTS_TOKEN_KEY);
  }
  showLoginOverlay();
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('loginName').value.trim();
  const pin = document.getElementById('loginPin').value.trim();
  if(!name || !/^\d{4}$/.test(pin)){
    document.getElementById('loginError').textContent = '이름과 4자리 숫자 PIN을 입력해주세요.';
    return;
  }
  try {
    const res = await fetch('/api/points/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, pin }),
    });
    const data = await res.json();
    if(!res.ok){
      document.getElementById('loginError').textContent = data.error || '로그인에 실패했어요.';
      return;
    }
    localStorage.setItem(POINTS_TOKEN_KEY, data.token);
    showPointsBar(data.name, data.points);
    hideLoginOverlay();
  } catch (e) {
    document.getElementById('loginError').textContent = '서버에 연결할 수 없어요. 잠시 후 다시 시도해주세요.';
  }
});

document.getElementById('switchNameBtn').addEventListener('click', () => {
  localStorage.removeItem(POINTS_TOKEN_KEY);
  document.getElementById('pointsBar').hidden = true;
  document.getElementById('loginForm').reset();
  showLoginOverlay();
});

document.querySelectorAll('.tabBtn').forEach(btn => {
  btn.classList.toggle('active', btn.dataset.tab === activeTab);
  btn.addEventListener('click', () => {
    if(btn.dataset.tab === activeTab) return;
    activeTab = btn.dataset.tab;
    document.querySelectorAll('.tabBtn').forEach(b => b.classList.toggle('active', b === btn));
    renderGames();
  });
});

loadCosts().then(renderGames);
initPoints();
</script>
</body>
</html>
