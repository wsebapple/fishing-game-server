<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지렁이 땅따먹기</title>
<meta name="description" content="옛날 DOS 오락기에 있던 지렁이 게임! 먹이를 먹고 길게길게 자라나요">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #1c1408;
    --ink: #eef7e6;
    --button: #8be04f;
    --button-dark: #3f8a1f;
    --panel: #23361a;
    --accent: #ff6b4a;
    --gold: #ffcf3f;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { height: 100%; }
  body {
    margin: 0; height: 100%;
    background: var(--page);
    font-family: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    position: relative;
    width: min(96vw, calc(92dvh * 0.667));
    aspect-ratio: 0.667 / 1;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 25px 80px #000a;
    border: 3px solid #3a2c14;
  }
  @media (pointer: coarse), (max-width: 560px) {
    #wrap { width: 100vw; height: 100dvh; aspect-ratio: auto; border-radius: 0; border: 0; }
  }
  canvas { display: block; width: 100%; height: 100%; }

  #hud {
    position: absolute; left: 0; right: 0; top: 0;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 0;
    display: flex; align-items: flex-start; justify-content: space-between;
    pointer-events: none; text-shadow: 0 2px 4px #000c;
  }
  #hud .score { font-size: clamp(18px, 4.6vw, 26px); color: var(--gold); }
  #hud .level { font-size: clamp(13px, 3.2vw, 17px); color: #cfe8b9; text-align: center; }
  #hud .lives { font-size: clamp(16px, 4vw, 22px); letter-spacing: 2px; text-align: right; }

  .overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(15, 12, 4, 0.72);
    backdrop-filter: blur(1px);
  }
  .overlay.hidden { display: none; }
  .card {
    background: var(--panel);
    border: 4px solid #4d7a2c;
    border-radius: 14px;
    padding: 6% 7%;
    text-align: center;
    max-width: 86%;
    box-shadow: 8px 8px 0 var(--accent);
  }
  .card h1 { margin: 0 0 0.25em; font-size: clamp(22px, 6.2vw, 38px); font-weight: 400; color: #fff; }
  .card p  { margin: 0 0 0.9em; font-size: clamp(13px, 3vw, 18px); line-height: 1.5; color: #dcead0; }
  .card .big { font-size: clamp(28px, 8vw, 44px); color: var(--gold); margin: 0.1em 0 0.5em; }
  .card button {
    font-family: inherit;
    font-size: clamp(17px, 4vw, 26px);
    color: #0f2405;
    background: var(--button);
    border: 4px solid #0f2405;
    border-radius: 8px;
    padding: 0.25em 1.3em;
    box-shadow: 0 6px 0 var(--button-dark);
    cursor: pointer;
    margin: 4px;
  }
  .card button:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--button-dark); }
  .card button:focus-visible { outline: 4px dashed #fff; outline-offset: 4px; }
  .card button.ghost { background: #2d4420; color: #dcead0; box-shadow: 0 6px 0 #17280f; }

  #muteBtn, #pauseBtn {
    position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); pointer-events: auto;
    font-size: clamp(16px, 4vw, 22px);
    background: rgba(255,255,255,0.12);
    border: 2px solid #ffffff55; border-radius: 8px;
    padding: 0.15em 0.45em; cursor: pointer; color: #fff;
  }
  #muteBtn { right: 1.5%; }
  #pauseBtn { left: 1.5%; }
  #pauseBtn.hidden { display: none; }

  .home { display: inline-block; margin-top: 0.7em; font-size: clamp(12px, 3vw, 16px); color: #b9d89a; }
  .home.hidden { display: none; }

  /* 모바일용 방향 버튼 (그리드 위에서 정확하게 움직이려면 스와이프보다 버튼이 편해요) */
  #pad {
    position: absolute; left: 0; right: 0; bottom: calc(4% + env(safe-area-inset-bottom, 0px));
    display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px);
    gap: 4px; justify-content: center; pointer-events: none;
  }
  #pad button {
    pointer-events: auto;
    font-size: 22px; color: #fff;
    background: rgba(255,255,255,0.16);
    border: 2px solid #ffffff44; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  #pad button:active { background: rgba(255,255,255,0.32); }
  #padUp { grid-column: 2; grid-row: 1; }
  #padLeft { grid-column: 1; grid-row: 2; }
  #padRight { grid-column: 3; grid-row: 2; }
  #padDown { grid-column: 2; grid-row: 3; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="score" id="scoreText">0</div>
    <div class="level" id="levelText">LEVEL 1</div>
    <div class="lives" id="livesText">❤️❤️❤️</div>
  </div>

  <button id="muteBtn" aria-label="소리 켜기 끄기">🔊</button>
  <button id="pauseBtn" class="hidden" aria-label="멈추기">⏸️</button>

  <div id="pad">
    <button id="padUp" aria-label="위로">⬆️</button>
    <button id="padLeft" aria-label="왼쪽으로">⬅️</button>
    <button id="padRight" aria-label="오른쪽으로">➡️</button>
    <button id="padDown" aria-label="아래로">⬇️</button>
  </div>

  <div class="overlay hidden" id="pauseScreen">
    <div class="card">
      <h1>잠깐 멈춤 ⏸️</h1>
      <p>쉬었다가 준비되면 눌러!<br>(키보드 P 나 Esc 로도 할 수 있어)</p>
      <button id="resumeBtn">계속하기</button>
      <button id="quitBtn" class="ghost">처음으로</button>
    </div>
  </div>

  <div class="overlay" id="startScreen">
    <div class="card">
      <h1>🐛 지렁이 땅따먹기</h1>
      <p>방향키나 화면 버튼으로 지렁이를 움직여요.<br>
         빨간 먹이를 먹으면 쑥쑥 길어져요! 벽이나<br>
         내 몸, 흙벽돌에 부딪히면 목숨이 하나 줄어요.<br>
         레벨이 오를수록 미로 벽돌이 늘어나요!</p>
      <button id="startBtn">시작하기 ▶</button>
      <p style="margin-top:0.8em; font-size:0.85em; color:#9fbf85;">PC에서는 방향키·WASD로 움직여요</p>
      <a id="homeLink" class="home hidden" href="/">🏠 게임 놀이터로</a>
    </div>
  </div>

  <div class="overlay hidden" id="overScreen">
    <div class="card">
      <h1 id="overTitle">게임 끝! 🪱</h1>
      <div class="big" id="overScore">0점</div>
      <p id="overBest"></p>
      <button id="retryBtn">다시 하기</button>
      <button id="menuBtn2" class="ghost">처음 화면</button>
      <a id="homeLink2" class="home hidden" href="/">🏠 게임 놀이터로</a>
    </div>
  </div>
</div>

<script>
// =====================================================
//  🐛 지렁이 땅따먹기 — 그리드 위를 기어다니는 클래식 스네이크(옛날 DOS Nibbles류) 게임
// =====================================================
const CELL = 24, COLS = 20, ROWS = 30;
const W = COLS * CELL, H = ROWS * CELL;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function fitCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
}
window.addEventListener('resize', fitCanvas);

// ---------- 🔊 사운드 (소리 파일 없이 코드로 직접 연주) ----------
const Snd = {
  ctx: null, muted: false,
  ensure() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(freq, t, len, type, vol, freqEnd) {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t + len);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + len);
    o.connect(g).connect(this.ctx.destination);
    o.start(t); o.stop(t + len);
  },
  play(kind) {
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime;
    if (kind === 'eat') { this.tone(660, t, 0.07, 'square', 0.1, 1000); return; }
    if (kind === 'hit') {
      this.tone(90, t, 0.09, 'square', 0.12);
      this.tone(60, t + 0.03, 0.12, 'square', 0.1);
      return;
    }
    if (kind === 'levelup') { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, t + i * 0.07, 0.13, 'triangle', 0.14)); return; }
    if (kind === 'gameover') { [392, 349, 294, 220].forEach((f, i) => this.tone(f, t + i * 0.16, 0.24, 'sine', 0.16)); return; }
  },
};

// ---------- 🧱 벽 패턴 (레벨이 오를수록 순서대로 등장) ----------
function mirrorX(cells) { return cells.concat(cells.map(([x, y]) => [COLS - 1 - x, y])); }
const WALL_PATTERNS = [
  // 가로 담: 위/아래에 벽돌 두 줄
  () => {
    const cells = [];
    for (const y of [8, 21]) for (const x of [2, 3, 4, 5, 6, 7]) cells.push([x, y]);
    return mirrorX(cells);
  },
  // 네모 테두리: 가운데를 두르는 큰 사각 방
  () => {
    const cells = [];
    for (let x = 4; x <= 15; x++) { cells.push([x, 6]); cells.push([x, 23]); }
    for (let y = 6; y <= 23; y++) { cells.push([4, y]); cells.push([15, y]); }
    return cells;
  },
  // 흩어진 벽돌: 여기저기 작은 장애물
  () => {
    const cells = [];
    for (let y = 5; y < ROWS - 5; y += 5) {
      for (let x = 3; x < COLS - 3; x += 6) { cells.push([x, y]); cells.push([x + 1, y]); }
    }
    return cells;
  },
  // 십자 기둥 네 개
  () => {
    const cells = [];
    for (const [cx, cy] of [[5, 9], [14, 9], [5, 20], [14, 20]]) {
      cells.push([cx, cy], [cx - 1, cy], [cx + 1, cy], [cx, cy - 1], [cx, cy + 1]);
    }
    return cells;
  },
];

// ---------- 🐛 지렁이 상태 ----------
const key = (x, y) => x + ',' + y;
let snake, dir, nextDir, growPending, walls, wallsList, food;
let particles = [], popups = [];

function spawnSnake() {
  const sx = Math.floor(COLS / 2), sy = Math.floor(ROWS / 2);
  snake = [{ x: sx, y: sy }, { x: sx - 1, y: sy }, { x: sx - 2, y: sy }];
  dir = { x: 1, y: 0 };
  nextDir = dir;
  growPending = 0;
}

function buildWalls(level) {
  wallsList = [];
  walls = new Set();
  if (level < 2) return;
  const pattern = WALL_PATTERNS[(level - 2) % WALL_PATTERNS.length]();
  const snakeSet = new Set(snake.map(s => key(s.x, s.y)));
  for (const [x, y] of pattern) {
    if (x < 1 || x >= COLS - 1 || y < 1 || y >= ROWS - 1) continue; // 테두리 바로 안쪽은 비워둬요
    const k = key(x, y);
    if (snakeSet.has(k)) continue; // 지렁이 몸과 겹치면 그 칸만 건너뛰어요
    if (!walls.has(k)) { walls.add(k); wallsList.push({ x, y }); }
  }
}

function spawnFood() {
  const occupied = new Set(snake.map(s => key(s.x, s.y)));
  const free = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const k = key(x, y);
    if (!occupied.has(k) && !walls.has(k)) free.push({ x, y });
  }
  food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
}

// ---------- 🕹️ 입력 ----------
function setDir(x, y) {
  if (state !== 'play') { if (state === 'menu') beginGame(); return; }
  // 지금 진행 중인 방향의 정반대로는 못 꺾어요 (몸을 바로 들이받는 걸 막아요)
  if (x === -dir.x && y === -dir.y) return;
  nextDir = { x, y };
}
window.addEventListener('keydown', e => {
  const map = {
    ArrowLeft: [-1, 0], KeyA: [-1, 0],
    ArrowRight: [1, 0], KeyD: [1, 0],
    ArrowUp: [0, -1], KeyW: [0, -1],
    ArrowDown: [0, 1], KeyS: [0, 1],
  };
  if (map[e.code]) { e.preventDefault(); setDir(map[e.code][0], map[e.code][1]); }
  if (e.code === 'Escape' || e.code === 'KeyP') { if (!e.repeat) togglePause(); }
  if (state === 'menu' && (e.code === 'Space' || e.code === 'Enter')) beginGame();
}, true);
document.getElementById('padUp').addEventListener('pointerdown', e => { e.preventDefault(); Snd.ensure(); setDir(0, -1); });
document.getElementById('padDown').addEventListener('pointerdown', e => { e.preventDefault(); Snd.ensure(); setDir(0, 1); });
document.getElementById('padLeft').addEventListener('pointerdown', e => { e.preventDefault(); Snd.ensure(); setDir(-1, 0); });
document.getElementById('padRight').addEventListener('pointerdown', e => { e.preventDefault(); Snd.ensure(); setDir(1, 0); });

// 캔버스에서 스와이프해도 방향을 바꿀 수 있어요
let touchStart = null;
canvas.addEventListener('pointerdown', e => {
  Snd.ensure();
  if (state === 'menu') { beginGame(); return; }
  touchStart = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('pointerup', e => {
  if (!touchStart) return;
  const dx = e.clientX - touchStart.x, dy = e.clientY - touchStart.y;
  touchStart = null;
  if (Math.hypot(dx, dy) < 18) return;
  if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
  else setDir(0, dy > 0 ? 1 : -1);
});
document.querySelectorAll('button').forEach(b => b.addEventListener('click', () => b.blur()));

// ---------- 💥 이펙트 ----------
function explode(x, y, color) {
  for (let i = 0; i < 16; i++) {
    const a = Math.random() * Math.PI * 2, spd = 60 + Math.random() * 160;
    particles.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, life: 0.35 + Math.random() * 0.3, maxLife: 0.65, r: 2 + Math.random() * 3, color });
  }
  if (navigator.vibrate) { try { navigator.vibrate(20); } catch (e) {} }
}
function addPopup(x, y, text, color) { popups.push({ x, y, text, color, life: 0.7, maxLife: 0.7 }); }

// ---------- 🎮 게임 상태 ----------
let state = 'menu'; // menu | play | paused | respawn | over
let score = 0, best = 0, level = 1, lives = 3, eatenThisLevel = 0;
let moveTimer = 0, respawnTimer = 0;
const EAT_PER_LEVEL = 6;
try { best = parseInt(localStorage.getItem('wormBest') || '0', 10) || 0; } catch (e) {}

const startScreen = document.getElementById('startScreen');
const pauseScreen = document.getElementById('pauseScreen');
const overScreen = document.getElementById('overScreen');
const pauseBtn = document.getElementById('pauseBtn');

function tickInterval() {
  const base = 175 - (level - 1) * 9 - snake.length * 1.4;
  return Math.max(70, base) / 1000;
}

function updateHud() {
  document.getElementById('scoreText').textContent = score;
  document.getElementById('levelText').textContent = 'LEVEL ' + level;
  document.getElementById('livesText').textContent = '❤️'.repeat(Math.max(0, lives));
}

function beginGame() {
  state = 'play';
  score = 0; level = 1; lives = 3; eatenThisLevel = 0;
  particles = []; popups = [];
  spawnSnake();
  buildWalls(level);
  spawnFood();
  moveTimer = tickInterval();
  startScreen.classList.add('hidden');
  overScreen.classList.add('hidden');
  pauseBtn.classList.remove('hidden');
  Snd.ensure();
  updateHud();
}
document.getElementById('startBtn').addEventListener('click', beginGame);

function levelUp() {
  level++;
  eatenThisLevel = 0;
  buildWalls(level);
  spawnFood();
  Snd.play('levelup');
  addPopup(snake[0].x * CELL, snake[0].y * CELL, 'LEVEL ' + level + '!', '#ffcf3f');
}

function loseLife() {
  Snd.play('hit');
  explode(snake[0].x * CELL + CELL / 2, snake[0].y * CELL + CELL / 2, '#ff6b4a');
  lives--;
  updateHud();
  if (lives <= 0) { gameOver(); return; }
  state = 'respawn';
  respawnTimer = 1.0;
}

function respawnSnake() {
  const occupied = new Set();
  for (const w of wallsList) occupied.add(key(w.x, w.y));
  spawnSnake();
  // 리스폰 자리에 벽이 있으면 그 근처 벽만 비워서 항상 안전하게 시작해요
  for (const s of snake) walls.delete(key(s.x, s.y));
  wallsList = wallsList.filter(w => !snake.some(s => s.x === w.x && s.y === w.y));
  if (!food || walls.has(key(food.x, food.y)) || snake.some(s => s.x === food.x && s.y === food.y)) spawnFood();
  moveTimer = tickInterval();
  state = 'play';
}

function gameOver() {
  state = 'over';
  pauseBtn.classList.add('hidden');
  Snd.play('gameover');
  if (score > best) { best = score; try { localStorage.setItem('wormBest', String(best)); } catch (e) {} }
  document.getElementById('overTitle').textContent = score >= best && score > 0 ? '최고 기록! 🏆' : '게임 끝! 🪱';
  document.getElementById('overScore').textContent = score + '점';
  document.getElementById('overBest').textContent = '최고 기록: ' + best + '점 · LEVEL ' + level;
  overScreen.classList.remove('hidden');
}
document.getElementById('retryBtn').addEventListener('click', beginGame);
document.getElementById('menuBtn2').addEventListener('click', showMenu);
function showMenu() {
  state = 'menu';
  overScreen.classList.add('hidden');
  pauseScreen.classList.add('hidden');
  pauseBtn.classList.add('hidden');
  startScreen.classList.remove('hidden');
}

let stateBeforePause = 'play';
function pauseGame() {
  if (state !== 'play' && state !== 'respawn') return;
  stateBeforePause = state;
  state = 'paused';
  if (Snd.ctx) Snd.ctx.suspend();
  pauseScreen.classList.remove('hidden');
}
function resumeGame() {
  if (state !== 'paused') return;
  state = stateBeforePause;
  if (Snd.ctx) Snd.ctx.resume();
  pauseScreen.classList.add('hidden');
  last = performance.now();
}
function togglePause() {
  if (state === 'paused') resumeGame();
  else if (state === 'play' || state === 'respawn') pauseGame();
}
pauseBtn.addEventListener('click', togglePause);
document.getElementById('resumeBtn').addEventListener('click', resumeGame);
document.getElementById('quitBtn').addEventListener('click', () => { pauseScreen.classList.add('hidden'); showMenu(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

const muteBtn = document.getElementById('muteBtn');
muteBtn.addEventListener('click', () => {
  Snd.ensure();
  Snd.muted = !Snd.muted;
  muteBtn.textContent = Snd.muted ? '🔇' : '🔊';
});

if (location.pathname.startsWith('/worm-game')) {
  document.getElementById('homeLink').classList.remove('hidden');
  document.getElementById('homeLink2').classList.remove('hidden');
}

// ---------- 🔄 한 칸 이동 ----------
function step() {
  dir = nextDir;
  const head = snake[0];
  const nx = head.x + dir.x, ny = head.y + dir.y;

  if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) { loseLife(); return; }
  if (walls.has(key(nx, ny))) { loseLife(); return; }
  const bodyToCheck = growPending > 0 ? snake : snake.slice(0, -1);
  if (bodyToCheck.some(s => s.x === nx && s.y === ny)) { loseLife(); return; }

  snake.unshift({ x: nx, y: ny });
  if (food && nx === food.x && ny === food.y) {
    growPending++;
    score += 10 * level;
    eatenThisLevel++;
    Snd.play('eat');
    addPopup(nx * CELL + CELL / 2, ny * CELL + CELL / 2, '+' + (10 * level), '#8be04f');
    spawnFood();
    if (eatenThisLevel >= EAT_PER_LEVEL) levelUp();
  } else if (growPending > 0) {
    growPending--;
  } else {
    snake.pop();
  }
}

// ---------- 🔁 업데이트 / 그리기 ----------
function update(dt) {
  for (const pt of particles) { pt.life -= dt; pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vx *= 0.94; pt.vy *= 0.94; }
  particles = particles.filter(pt => pt.life > 0);
  for (const up of popups) { up.life -= dt; up.y -= 24 * dt; }
  popups = popups.filter(up => up.life > 0);

  if (state === 'respawn') {
    respawnTimer -= dt;
    if (respawnTimer <= 0) respawnSnake();
    return;
  }
  if (state !== 'play') return;
  moveTimer -= dt;
  if (moveTimer <= 0) { step(); moveTimer = tickInterval(); updateHud(); }
}

function drawBoard() {
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#26170a'); bgGrad.addColorStop(1, '#12300a');
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,0.04)'; ctx.lineWidth = 1;
  for (let x = 1; x < COLS; x++) { ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, H); ctx.stroke(); }
  for (let y = 1; y < ROWS; y++) { ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(W, y * CELL); ctx.stroke(); }
  ctx.strokeStyle = '#4d7a2c'; ctx.lineWidth = 4;
  ctx.strokeRect(2, 2, W - 4, H - 4);
}

function drawWalls() {
  for (const w of wallsList) {
    const x = w.x * CELL, y = w.y * CELL;
    ctx.fillStyle = '#6b4a26';
    ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(x + 1, y + 1, CELL - 2, 4);
    ctx.strokeStyle = '#3a2c14'; ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, y + 1, CELL - 2, CELL - 2);
  }
}

function drawFood() {
  if (!food) return;
  const cx = food.x * CELL + CELL / 2, cy = food.y * CELL + CELL / 2;
  const bob = Math.sin(performance.now() / 200) * 1.5;
  ctx.save();
  ctx.translate(cx, cy + bob);
  ctx.beginPath(); ctx.arc(0, 0, CELL * 0.36, 0, 7);
  ctx.fillStyle = '#ff6b4a'; ctx.fill();
  ctx.strokeStyle = '#a13418'; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.arc(-CELL * 0.12, -CELL * 0.12, CELL * 0.1, 0, 7);
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill();
  ctx.fillStyle = '#3f8a1f';
  ctx.fillRect(-2, -CELL * 0.48, 4, CELL * 0.2);
  ctx.restore();
}

function drawSnake() {
  if (state === 'respawn') return;
  for (let i = snake.length - 1; i >= 0; i--) {
    const s = snake[i];
    const cx = s.x * CELL + CELL / 2, cy = s.y * CELL + CELL / 2;
    const isHead = i === 0;
    ctx.beginPath();
    ctx.arc(cx, cy, CELL * (isHead ? 0.46 : 0.42), 0, 7);
    ctx.fillStyle = isHead ? '#a6ef67' : (i % 2 === 0 ? '#8be04f' : '#6fc93a');
    ctx.fill();
    ctx.strokeStyle = '#2d5a12'; ctx.lineWidth = 2; ctx.stroke();
    if (isHead) {
      const ex = dir.x * CELL * 0.16, ey = dir.y * CELL * 0.16;
      const px = -dir.y * CELL * 0.14, py = dir.x * CELL * 0.14;
      ctx.fillStyle = '#12300a';
      ctx.beginPath(); ctx.arc(cx + ex + px, cy + ey + py, 2.4, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + ex - px, cy + ey - py, 2.4, 0, 7); ctx.fill();
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawBoard();
  drawWalls();
  drawFood();
  drawSnake();

  for (const pt of particles) {
    ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
    ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }
  for (const up of popups) {
    ctx.globalAlpha = Math.max(0, up.life / up.maxLife);
    ctx.fillStyle = up.color; ctx.font = '18px Jua, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(up.text, up.x, up.y);
    ctx.globalAlpha = 1;
  }

  if (state === 'respawn') {
    ctx.fillStyle = '#fff'; ctx.font = '26px Jua, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('다시 출발!', W / 2, H / 2);
  }
}

// ---------- 🔁 게임 루프 ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
spawnSnake();
buildWalls(1);
fitCanvas();
requestAnimationFrame(loop);
</script>
</body>
