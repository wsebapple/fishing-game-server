<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>관리자 화면</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<style>
  :root{ --ink:#123a57; --ink-soft:#4a6a82; --card:#fff; --edge:#d7eef9; --accent:#ff6b6b; --accent-dark:#d94f4f; }
  *{ box-sizing:border-box; }
  body{ font-family:system-ui, sans-serif; color:var(--ink); background:#eef6fb; margin:0; padding:24px 16px 48px; }
  main{ max-width:640px; margin:0 auto; }
  a{ color:var(--ink-soft); }
  h1{ font-size:24px; margin:0 0 16px; }
  h2{ font-size:18px; margin:0 0 12px; }
  p.hint{ color:var(--ink-soft); margin:0 0 14px; }
  .card{ background:var(--card); border:1px solid var(--edge); border-radius:14px; padding:18px; margin-bottom:16px; }
  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th, td{ text-align:left; padding:8px 6px; border-bottom:1px solid var(--edge); }
  input[type=text], input[type=number], input[type=password]{
    font:inherit; padding:6px 8px; border:1px solid var(--edge); border-radius:8px; width:100%; box-sizing:border-box;
  }
  button{
    font:inherit; padding:6px 14px; border:none; border-radius:999px; background:var(--accent); color:#fff; cursor:pointer;
  }
  button:hover{ background:var(--accent-dark); }
  .row{ display:flex; gap:8px; align-items:center; }
  .error{ color:var(--accent-dark); font-size:14px; min-height:1.4em; }
  .amountInput{ width:90px; }
  #gate{ max-width:320px; margin:80px auto; text-align:center; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<main>
  <div id="gate" class="card">
    <h1>관리자 입장</h1>
    <p class="hint">관리자 코드를 입력해주세요.</p>
    <form id="gateForm">
      <input type="password" id="adminKeyInput" placeholder="관리자 코드" autocomplete="off" required>
      <div class="error" id="gateError"></div>
      <button type="submit" style="width:100%; margin-top:8px;">입장</button>
    </form>
  </div>

  <div id="panel" hidden>
    <h1>관리자 화면</h1>
    <p class="hint"><a href="/">← 게임 놀이터로 돌아가기</a></p>

    <div class="card">
      <h2>게임별 입장료</h2>
      <table id="costsTable">
        <thead><tr><th>게임</th><th>입장료(점)</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="card">
      <h2>플레이어 포인트</h2>
      <div class="row" style="margin-bottom:12px;">
        <input type="text" id="playersFilter" placeholder="이름으로 찾기">
        <button type="button" id="refreshPlayersBtn">새로고침</button>
      </div>
      <table id="playersTable">
        <thead><tr><th>이름</th><th>포인트</th><th>지급/차감</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</main>

<script>
// 관리자 코드는 어디에도 저장하지 않고 이 탭의 메모리에만 잠깐 들고 있어요(새로고침하면 다시 입력해야 해요)
let ADMIN_KEY = null;
let lastPlayers = [];

function adminFetch(url, options){
  options = options || {};
  const headers = Object.assign({}, options.headers, { 'X-Admin-Key': ADMIN_KEY });
  return fetch(url, Object.assign({}, options, { headers }));
}

document.getElementById('gateForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  ADMIN_KEY = document.getElementById('adminKeyInput').value;
  const res = await adminFetch('/api/admin/players');
  if(!res.ok){
    ADMIN_KEY = null;
    document.getElementById('gateError').textContent = '코드가 틀렸어요.';
    return;
  }
  lastPlayers = await res.json();
  document.getElementById('gate').hidden = true;
  document.getElementById('panel').hidden = false;
  renderPlayers();
  loadCosts();
});

async function loadCosts(){
  const res = await adminFetch('/api/admin/costs');
  if(!res.ok) return;
  const costs = await res.json();
  const tbody = document.querySelector('#costsTable tbody');
  tbody.innerHTML = '';
  Object.entries(costs).forEach(([gameId, cost]) => {
    const tr = document.createElement('tr');
    const nameCell = document.createElement('td');
    nameCell.textContent = gameId;
    const inputCell = document.createElement('td');
    const input = document.createElement('input');
    input.type = 'number'; input.min = '0'; input.value = cost;
    inputCell.appendChild(input);
    const btnCell = document.createElement('td');
    const btn = document.createElement('button');
    btn.type = 'button'; btn.textContent = '저장';
    btn.addEventListener('click', async () => {
      const value = Number(input.value);
      if(!Number.isFinite(value) || value < 0) return;
      const res2 = await adminFetch('/api/admin/costs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ gameId, cost: value }),
      });
      if(res2.ok){ btn.textContent = '저장됨'; setTimeout(() => { btn.textContent = '저장'; }, 1200); }
    });
    btnCell.appendChild(btn);
    tr.append(nameCell, inputCell, btnCell);
    tbody.appendChild(tr);
  });
}

function renderPlayers(){
  const tbody = document.querySelector('#playersTable tbody');
  const filter = document.getElementById('playersFilter').value.trim();
  tbody.innerHTML = '';
  lastPlayers
    .filter(p => !filter || p.name.includes(filter))
    .sort((a, b) => b.points - a.points)
    .forEach(p => {
      const tr = document.createElement('tr');
      const nameCell = document.createElement('td');
      nameCell.textContent = p.name;
      const pointsCell = document.createElement('td');
      pointsCell.textContent = p.points;
      const actionCell = document.createElement('td');
      const row = document.createElement('div');
      row.className = 'row';
      const amountInput = document.createElement('input');
      amountInput.type = 'number'; amountInput.placeholder = '±포인트'; amountInput.className = 'amountInput';
      const grantBtn = document.createElement('button');
      grantBtn.type = 'button'; grantBtn.textContent = '적용';
      grantBtn.addEventListener('click', async () => {
        const amount = Number(amountInput.value);
        if(!Number.isFinite(amount) || amount === 0) return;
        const res = await adminFetch('/api/admin/grant', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: p.name, amount }),
        });
        if(res.ok){
          const data = await res.json();
          pointsCell.textContent = data.points;
          p.points = data.points;
          amountInput.value = '';
        }
      });
      row.append(amountInput, grantBtn);
      actionCell.appendChild(row);
      tr.append(nameCell, pointsCell, actionCell);
      tbody.appendChild(tr);
    });
}

document.getElementById('refreshPlayersBtn').addEventListener('click', async () => {
  const res = await adminFetch('/api/admin/players');
  if(res.ok){ lastPlayers = await res.json(); renderPlayers(); }
});
document.getElementById('playersFilter').addEventListener('input', renderPlayers);
</script>
</body>
</html>
