<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>과일 합체 게임</title>
<meta name="description" content="같은 과일을 합쳐서 수박까지 만드는 게임">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍉</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --page-top: #fff3df;
    --page-bottom: #ffd79b;
    --ink: #4a2f1c;
    --panel: #fffaf0;
    --button: #ff8a3d;
    --button-dark: #c85d16;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page-top:#2a1f14; --page-bottom:#1b1410; --panel:#3a2c1c; --ink:#ffe9cf; }
  }
  :root[data-theme="dark"] { --page-top:#2a1f14; --page-bottom:#1b1410; --panel:#3a2c1c; --ink:#ffe9cf; }

  html { height: 100%; }
  body {
    margin: 0; height: 100%;
    background: linear-gradient(180deg, var(--page-top), var(--page-bottom));
    font-family: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    position: relative;
    width: min(94vw, calc(92dvh * (640 / 860)));
    aspect-ratio: 640 / 860;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(74,47,28,0.25);
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(74,47,28,0.45);
  }
  .overlay.hidden { display: none; }
  .card {
    background: var(--panel);
    border: 4px solid var(--ink);
    border-radius: 18px;
    padding: 5% 7%;
    text-align: center;
    max-width: 84%;
    max-height: 88%;
    overflow: auto;
    box-shadow: 8px 8px 0 var(--button-dark);
  }
  .card h1 { margin: 0 0 0.3em; font-size: clamp(24px, 5.5vw, 42px); font-weight: 400; }
  .card p  { margin: 0 0 0.7em; font-size: clamp(13px, 2.3vw, 19px); line-height: 1.5; }
  .card .best { font-size: clamp(13px, 2.1vw, 17px); opacity: 0.85; margin-bottom: 0.8em; }
  .card button {
    font-family: inherit;
    font-size: clamp(18px, 3.4vw, 28px);
    color: #fff;
    background: var(--button);
    border: 4px solid var(--ink);
    border-radius: 10px;
    padding: 0.25em 1.1em;
    box-shadow: 0 6px 0 var(--button-dark);
    cursor: pointer;
    margin: 4px;
  }
  .card button:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--button-dark); }
  .card button:focus-visible { outline: 4px dashed var(--ink); outline-offset: 3px; }
  .card button.small {
    font-size: clamp(13px, 2vw, 18px);
    padding: 0.25em 0.8em; border-width: 3px; box-shadow: 0 3px 0 var(--button-dark);
    background: var(--panel); color: var(--ink);
  }
  .home { display: inline-block; margin-top: 0.7em; font-size: clamp(12px, 1.8vw, 16px); color: var(--ink); }
  .home.hidden { display: none; }

  #muteBtn, #pauseBtn {
    position: absolute; right: 2%; bottom: 2%;
    font-size: clamp(15px, 2.4vw, 24px);
    background: rgba(255,255,255,0.85);
    border: 3px solid var(--ink); border-radius: 8px;
    padding: 0.15em 0.45em; cursor: pointer; z-index: 2;
  }
  #pauseBtn { right: auto; left: 2%; }
  #pauseBtn.hidden { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <button id="muteBtn" aria-label="소리 켜기 끄기">🔊</button>
  <button id="pauseBtn" class="hidden" aria-label="멈추기">⏸️</button>

  <div class="overlay hidden" id="pauseScreen">
    <div class="card">
      <h1>잠깐 멈춤 ⏸️</h1>
      <p>쉬었다가 준비되면 눌러!</p>
      <button id="resumeBtn">계속하기</button>
      <button id="quitBtn" class="small">처음 화면으로</button>
    </div>
  </div>

  <div class="overlay" id="startScreen">
    <div class="card">
      <h1>🍒 과일 합체 게임 🍉</h1>
      <p>같은 과일 두 개가 만나면 다음 과일로 합쳐져요!<br>
         드래그해서 자리를 정하고 손을 떼면 쿵! 떨어져요.<br>
         (방향키로 움직이고 스페이스바로 떨어뜨릴 수도 있어요)<br>
         빨간 줄 위로 과일이 쌓이면 게임이 끝나요. 수박까지 만들어봐요!</p>
      <p class="best">최고 점수: <span id="bestStart">0</span></p>
      <button id="startBtn">시작하기</button>
      <a id="homeLink" class="home hidden" href="/">🏠 게임 놀이터로</a>
    </div>
  </div>

  <div class="overlay hidden" id="overScreen">
    <div class="card">
      <h1>게임 끝! 🍎</h1>
      <p id="overScore"></p>
      <p class="best">최고 점수: <span id="bestOver">0</span></p>
      <button id="againBtn">다시하기</button>
      <a id="homeLink2" class="home hidden" href="/">🏠 게임 놀이터로</a>
    </div>
  </div>
</div>

<script>
// =====================================================
//  ⚙️ 게임 설정 — 숫자를 바꾸면 게임이 달라져요!
// =====================================================
const SETTINGS = {
  gravity: 1500,       // 중력 (크면 더 빨리 떨어져요)
  airDamp: 0.995,      // 공기 저항(가로 속도를 아주 조금씩 줄여요)
  moveSpeed: 420,      // 방향키로 움직이는 빠르기
  dropCooldown: 0.45,  // 떨어뜨린 뒤 다음 과일이 준비될 때까지 쉬는 시간(초)
  dangerLimit: 1.2,    // 빨간 줄 위에 이만큼(초) 쌓여 있으면 게임 끝
};

// 작은 과일부터 큰 과일 순서예요. 두 개가 만나면 다음 순서 과일이 돼요.
const FRUITS = [
  { name: '체리',     r: 18,  color: '#ff5d7a', dark: '#c73652', score: 1,  stem: true },
  { name: '딸기',     r: 24,  color: '#ff3355', dark: '#b8102c', score: 3,  stem: true },
  { name: '포도',     r: 30,  color: '#9b59b6', dark: '#663399', score: 6,  stem: true },
  { name: '귤',       r: 38,  color: '#ffa726', dark: '#c76d00', score: 10, stem: true },
  { name: '감',       r: 46,  color: '#ff7d3c', dark: '#c84e12', score: 15, stem: true },
  { name: '사과',     r: 54,  color: '#ef4444', dark: '#a91f1f', score: 21, stem: true },
  { name: '배',       r: 64,  color: '#cddc39', dark: '#8f9c1f', score: 28, stem: true },
  { name: '복숭아',   r: 74,  color: '#ffb3a1', dark: '#e0725a', score: 36, stem: true },
  { name: '파인애플', r: 86,  color: '#f6d54a', dark: '#c9a11a', score: 45, pattern: 'pine' },
  { name: '수박',     r: 100, color: '#3fae4e', dark: '#256b30', score: 55, pattern: 'melon' },
];
// 새로 떨어지는 과일은 이 중에서만 골라요(뒤 숫자일수록 잘 안 나와요)
const SPAWN_WEIGHTS = [30, 25, 20, 15, 10];

// ---------- 화면 준비 ----------
const W = 640, H = 860;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function fitCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
}
window.addEventListener('resize', fitCanvas);

// 항아리(플레이 공간) 자리
const JAR = { left: 70, right: 570, top: 150, bottom: 820 };
const DROP_Y = 100;               // 다음 과일이 둥둥 떠 있는 높이
const DANGER_Y = JAR.top + 60;    // 이 줄 위로 넘치면 위험해요

// ---------- 소리 (컴퓨터가 직접 연주해요) ----------
const Music = {
  ctx: null, muted: false,
  init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); else this.ctx.resume(); },
  tone(freq, t, len, type, vol, freqEnd) {
    if (!this.ctx || this.muted) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t + len);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + len);
    o.connect(g).connect(this.ctx.destination);
    o.start(t); o.stop(t + len);
  },
  sfx(kind, level) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    if (kind === 'drop') this.tone(220, t, 0.12, 'sine', 0.2, 120);
    if (kind === 'merge') this.tone(320 + (level || 0) * 45, t, 0.18, 'triangle', 0.25, 500 + (level || 0) * 60);
    if (kind === 'big') { this.tone(523, t, 0.5, 'triangle', 0.3, 1046); this.tone(659, t + 0.08, 0.4, 'triangle', 0.25); }
    if (kind === 'over') this.tone(300, t, 0.6, 'sawtooth', 0.25, 60);
  },
};

// ---------- 과일 그리기 ----------
function drawFruit(f, now) {
  const cfg = FRUITS[f.level];
  let scale = 1;
  if (f.born) { const t = (now - f.born) / 150; scale = t < 1 ? (0.55 + 0.45 * Math.max(0, t)) : 1; }
  const r = f.r * scale;
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.fillStyle = cfg.color; ctx.strokeStyle = cfg.dark; ctx.lineWidth = Math.max(2, r * 0.06);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  if (cfg.pattern) {
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();
    ctx.strokeStyle = cfg.dark;
    if (cfg.pattern === 'melon') {
      ctx.lineWidth = Math.max(2, r * 0.1);
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(i * r * 0.32, -r);
        ctx.quadraticCurveTo(i * r * 0.32 + r * 0.15, 0, i * r * 0.32, r);
        ctx.stroke();
      }
    } else if (cfg.pattern === 'pine') {
      ctx.lineWidth = Math.max(1.5, r * 0.04);
      for (let x = -r * 1.4; x <= r * 1.4; x += r * 0.5) {
        ctx.beginPath(); ctx.moveTo(x, -r); ctx.lineTo(x + r * 1.2, r); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x, -r); ctx.lineTo(x - r * 1.2, r); ctx.stroke();
      }
    }
    ctx.restore();
  }

  if (cfg.pattern === 'pine') {
    ctx.fillStyle = '#4caf50';
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(i * r * 0.28, -r * 0.92);
      ctx.lineTo(i * r * 0.28 - r * 0.14, -r * 1.4);
      ctx.lineTo(i * r * 0.28 + r * 0.14, -r * 1.4);
      ctx.closePath(); ctx.fill();
    }
  } else if (cfg.stem) {
    ctx.strokeStyle = '#5a3921'; ctx.lineWidth = Math.max(2, r * 0.08);
    ctx.beginPath(); ctx.moveTo(0, -r * 0.95); ctx.lineTo(r * 0.12, -r * 1.25); ctx.stroke();
    ctx.fillStyle = '#4caf50';
    ctx.beginPath(); ctx.ellipse(r * 0.32, -r * 1.28, r * 0.22, r * 0.12, -0.5, 0, Math.PI * 2); ctx.fill();
  }

  const eyeX = r * 0.32, eyeY = -r * 0.05, eyeR = Math.max(1.5, r * 0.09);
  ctx.fillStyle = cfg.dark;
  ctx.beginPath(); ctx.arc(-eyeX, eyeY, eyeR, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(eyeX, eyeY, eyeR, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = Math.max(1.5, r * 0.06);
  ctx.beginPath(); ctx.arc(0, r * 0.2, r * 0.32, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  ctx.restore();
}

// ---------- 반짝이는 조각(합쳐질 때 팡!) ----------
let particles = [];
function burst(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 220;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, life: 0.5 + Math.random() * 0.3, size: 4 + Math.random() * 6, color });
  }
}
function updateParticles(dt) {
  particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.life -= dt; });
  particles = particles.filter(p => p.life > 0);
}
function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life * 2);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// ---------- 게임 상태 ----------
let best = 0;
try { best = parseInt(localStorage.getItem('fruitGameBest') || '0', 10) || 0; } catch (e) { /* 저장 공간을 못 쓰면 0점부터 */ }

let state = 'menu';   // menu | play | paused | over
let fruits = [];
let uid = 1;
let score = 0;
let current = 0, next = 0;
let dropX = (JAR.left + JAR.right) / 2;
let dropCooldown = 0;
let dangerTimer = 0;
let leftHeld = false, rightHeld = false;

function randomLevel() {
  const total = SPAWN_WEIGHTS.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < SPAWN_WEIGHTS.length; i++) {
    if (r < SPAWN_WEIGHTS[i]) return i;
    r -= SPAWN_WEIGHTS[i];
  }
  return 0;
}
function clampDropX(x, level) {
  const r = FRUITS[level].r;
  return Math.min(JAR.right - r, Math.max(JAR.left + r, x));
}
function addScore(n) { score += n; }

function resetGame() {
  fruits = []; particles = []; score = 0; dangerTimer = 0; dropCooldown = 0;
  current = randomLevel(); next = randomLevel();
  dropX = clampDropX((JAR.left + JAR.right) / 2, current);
}
function startGame() {
  resetGame();
  Music.init();
  startScreen.classList.add('hidden');
  overScreen.classList.add('hidden');
  pauseBtn.classList.remove('hidden');
  state = 'play';
  last = performance.now();
}

function tryDrop() {
  if (state !== 'play' || dropCooldown > 0) return;
  fruits.push({ id: uid++, level: current, x: dropX, y: DROP_Y, vx: 0, vy: 0, r: FRUITS[current].r });
  Music.sfx('drop');
  current = next;
  next = randomLevel();
  dropX = clampDropX(dropX, current);
  dropCooldown = SETTINGS.dropCooldown;
}

function clampFruit(f) {
  if (f.x - f.r < JAR.left) { f.x = JAR.left + f.r; f.vx *= -0.15; }
  if (f.x + f.r > JAR.right) { f.x = JAR.right - f.r; f.vx *= -0.15; }
  if (f.y + f.r > JAR.bottom) {
    f.y = JAR.bottom - f.r; f.vy *= -0.1;
    if (Math.abs(f.vy) < 15) f.vy = 0;
  }
  if (f.y - f.r < 0) { f.y = f.r; f.vy = Math.max(f.vy, 0); }
}

// 여러 번 반복해서 겹친 만큼만 서로 밀어내요(진짜 물리 엔진이 아니라 간단히 흉내낸 거예요)
function resolveCollisions() {
  const n = fruits.length;
  for (let iter = 0; iter < 4; iter++) {
    for (let i = 0; i < n; i++) {
      const a = fruits[i];
      for (let j = i + 1; j < n; j++) {
        const b = fruits[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.hypot(dx, dy);
        const minDist = a.r + b.r;
        if (dist >= minDist) continue;
        if (dist < 0.001) { a.x -= 0.5; b.x += 0.5; continue; }
        const overlap = minDist - dist;
        const nx = dx / dist, ny = dy / dist;
        const invA = 1 / (a.r * a.r), invB = 1 / (b.r * b.r);
        const total = invA + invB;
        a.x -= nx * overlap * (invA / total); a.y -= ny * overlap * (invA / total);
        b.x += nx * overlap * (invB / total); b.y += ny * overlap * (invB / total);
        const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (rel < 0) {
          const damp = rel * 0.3;
          a.vx += nx * damp * (invA / total) * 2; a.vy += ny * damp * (invA / total) * 2;
          b.vx -= nx * damp * (invB / total) * 2; b.vy -= ny * damp * (invB / total) * 2;
        }
      }
    }
  }
}

// 같은 과일끼리 닿으면 다음 과일로 합쳐요(여기가 나중에 "합성 이벤트 아이템" 같은 걸 끼워 넣기 좋은 자리예요)
function mergeCheck(now) {
  const toRemove = new Set();
  const toAdd = [];
  for (let i = 0; i < fruits.length; i++) {
    const a = fruits[i];
    if (toRemove.has(a.id)) continue;
    for (let j = i + 1; j < fruits.length; j++) {
      const b = fruits[j];
      if (toRemove.has(b.id) || a.level !== b.level) continue;
      const dist = Math.hypot(b.x - a.x, b.y - a.y);
      if (dist >= a.r + b.r) continue;
      toRemove.add(a.id); toRemove.add(b.id);
      const midX = (a.x + b.x) / 2, midY = (a.y + b.y) / 2;
      const level = a.level;
      if (level + 1 >= FRUITS.length) {
        addScore(FRUITS[level].score * 2);
        burst(midX, midY, FRUITS[level].color, 22);
        Music.sfx('big');
      } else {
        const newLevel = level + 1;
        addScore(FRUITS[newLevel].score);
        toAdd.push({
          id: uid++, level: newLevel, x: midX, y: midY,
          vx: (a.vx + b.vx) * 0.15, vy: Math.min(0, (a.vy + b.vy) * 0.15) - 30,
          r: FRUITS[newLevel].r, born: now,
        });
        burst(midX, midY, FRUITS[newLevel].color, 14);
        Music.sfx('merge', newLevel);
      }
      break;
    }
  }
  if (toRemove.size) {
    fruits = fruits.filter(f => !toRemove.has(f.id));
    fruits.push(...toAdd);
  }
}

function gameOver() {
  state = 'over';
  pauseBtn.classList.add('hidden');
  const isNewBest = score > best;
  if (isNewBest) best = score;
  try { localStorage.setItem('fruitGameBest', String(best)); } catch (e) { /* 저장이 안 돼도 게임엔 문제없어요 */ }
  Music.sfx('over');
  document.getElementById('overScore').textContent = '점수: ' + score + (isNewBest && score > 0 ? ' — 신기록! 🎉' : '');
  document.getElementById('bestOver').textContent = best;
  overScreen.classList.remove('hidden');
}

function update(dt, now) {
  updateParticles(dt);
  if (state !== 'play') return;
  if (dropCooldown > 0) dropCooldown = Math.max(0, dropCooldown - dt);
  if (leftHeld) dropX = clampDropX(dropX - SETTINGS.moveSpeed * dt, current);
  if (rightHeld) dropX = clampDropX(dropX + SETTINGS.moveSpeed * dt, current);

  for (const f of fruits) {
    f.vy += SETTINGS.gravity * dt;
    f.vx *= SETTINGS.airDamp;
    f.x += f.vx * dt; f.y += f.vy * dt;
    clampFruit(f);
  }
  resolveCollisions();
  mergeCheck(now);

  // 빨간 줄 위에 가만히 쌓여 있으면 위험해요(막 떨어지는 중인 과일은 안 쳐줘요)
  let anyDanger = false;
  for (const f of fruits) {
    const settled = Math.abs(f.vx) < 14 && Math.abs(f.vy) < 14;
    if (settled && f.y - f.r < DANGER_Y) { anyDanger = true; break; }
  }
  if (anyDanger) {
    dangerTimer += dt;
    if (dangerTimer > SETTINGS.dangerLimit) gameOver();
  } else {
    dangerTimer = Math.max(0, dangerTimer - dt * 2);
  }
}

// ---------- 그리기 ----------
function drawJar() {
  const { left, right, top, bottom } = JAR;
  const radius = 24;
  ctx.beginPath();
  ctx.moveTo(left, top);
  ctx.lineTo(left, bottom - radius);
  ctx.quadraticCurveTo(left, bottom, left + radius, bottom);
  ctx.lineTo(right - radius, bottom);
  ctx.quadraticCurveTo(right, bottom, right, bottom - radius);
  ctx.lineTo(right, top);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fill();
  ctx.strokeStyle = '#7a4b2a';
  ctx.lineWidth = 6;
  ctx.stroke();

  // 위험선
  const warn = Math.min(1, dangerTimer / SETTINGS.dangerLimit);
  ctx.save();
  ctx.setLineDash([10, 8]);
  ctx.strokeStyle = `rgba(220,40,40,${0.35 + warn * 0.6})`;
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(left + 6, DANGER_Y); ctx.lineTo(right - 6, DANGER_Y); ctx.stroke();
  ctx.restore();
}

function drawHud() {
  ctx.textAlign = 'left'; ctx.font = '28px Jua, sans-serif'; ctx.fillStyle = '#4a2f1c';
  ctx.fillText('점수 ' + score, 16, 40);
  ctx.font = '16px Jua, sans-serif';
  ctx.fillText('최고 ' + best, 16, 62);

  ctx.textAlign = 'right'; ctx.font = '16px Jua, sans-serif';
  ctx.fillText('다음', W - 34, 40);
}

let last = performance.now();
function draw(now) {
  // 배경
  ctx.clearRect(0, 0, W, H);
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#fff3df'); sky.addColorStop(1, '#ffd79b');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  drawJar();
  fruits.forEach(f => drawFruit(f, now));

  // 다음에 떨어질 과일(살짝 둥실둥실)
  if (state === 'play') {
    const bob = Math.sin(now / 300) * 4;
    ctx.globalAlpha = dropCooldown > 0 ? 0.4 : 1;
    ctx.save();
    ctx.setLineDash([6, 8]);
    ctx.strokeStyle = 'rgba(74,47,28,0.35)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(dropX, DROP_Y + FRUITS[current].r); ctx.lineTo(dropX, JAR.top); ctx.stroke();
    ctx.restore();
    drawFruit({ level: current, x: dropX, y: DROP_Y + bob, r: FRUITS[current].r }, now);
    ctx.globalAlpha = 1;
  }
  drawFruit({ level: next, x: W - 34, y: 68, r: Math.min(FRUITS[next].r, 24) }, now);

  drawParticles();
  drawHud();
}

function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt, now);
  draw(now);
  requestAnimationFrame(loop);
}

// ---------- 조작 ----------
const startScreen = document.getElementById('startScreen');
const overScreen = document.getElementById('overScreen');
const pauseScreen = document.getElementById('pauseScreen');
const pauseBtn = document.getElementById('pauseBtn');
document.getElementById('bestStart').textContent = best;

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('againBtn').addEventListener('click', startGame);

if (location.pathname.startsWith('/fruit-game')) {
  document.getElementById('homeLink').classList.remove('hidden');
  document.getElementById('homeLink2').classList.remove('hidden');
}

function pauseGame() {
  if (state !== 'play') return;
  state = 'paused';
  pauseScreen.classList.remove('hidden');
}
function resumeGame() {
  if (state !== 'paused') return;
  state = 'play';
  pauseScreen.classList.add('hidden');
  last = performance.now();
}
pauseBtn.addEventListener('click', pauseGame);
document.getElementById('resumeBtn').addEventListener('click', resumeGame);
document.getElementById('quitBtn').addEventListener('click', () => {
  state = 'menu';
  pauseScreen.classList.add('hidden');
  pauseBtn.classList.add('hidden');
  startScreen.classList.remove('hidden');
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

function pointerToX(e) {
  const rect = canvas.getBoundingClientRect();
  return (e.clientX - rect.left) * (W / rect.width);
}
canvas.addEventListener('pointerdown', e => { e.preventDefault(); if (state === 'play') dropX = clampDropX(pointerToX(e), current); });
canvas.addEventListener('pointermove', e => { if (state === 'play') dropX = clampDropX(pointerToX(e), current); });
window.addEventListener('pointerup', () => { if (state === 'play') tryDrop(); });

window.addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft') { leftHeld = true; e.preventDefault(); }
  if (e.code === 'ArrowRight') { rightHeld = true; e.preventDefault(); }
  if (e.code === 'KeyP' || e.key === 'Escape') { if (!e.repeat) (state === 'paused' ? resumeGame() : pauseGame()); return; }
  if (e.code === 'Space' || e.code === 'ArrowDown' || e.code === 'Enter') {
    e.preventDefault();
    if (state === 'menu') { if (!e.repeat) startGame(); return; }
    if (state === 'over') { if (!e.repeat) startGame(); return; }
    if (!e.repeat) tryDrop();
  }
}, true);
window.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft') leftHeld = false;
  if (e.code === 'ArrowRight') rightHeld = false;
}, true);

document.getElementById('muteBtn').addEventListener('click', () => {
  Music.muted = !Music.muted;
  document.getElementById('muteBtn').textContent = Music.muted ? '🔇' : '🔊';
});

fitCanvas();
requestAnimationFrame(loop);
</script>
